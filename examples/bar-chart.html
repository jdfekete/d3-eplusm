<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bar Chart using the EplusM scale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<script type="module">
  import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
  import { scaleEplusM } from 'd3-eplusm';

  const data = await d3.csv('data/omvs-sample.csv');

  // Declare the chart dimensions and margins.
  const width = 700;
  const height = 700;
  const marginTop = 10;
  const marginRight = 70;
  const marginBottom = 70;
  const marginLeft = 70;
  const maxExponent = Math.floor(
    Math.log10(d3.max(data, (d) => parseFloat(d.Amount))),
  );
  const evenBackgroundColor = '#ffffff'; // Background color for even exponents
  const oddBackgroundColor = '#f0f0f0'; // Background color for odd exponents
  const barColor = 'rgb(20, 22, 76)';

  // Declare the x (horizontal position) scale.
  const x = d3
    .scaleBand()
    .domain(data.map((d) => d.Letter))
    .range([marginLeft, width - marginRight])
    .padding(0.4);

  // Declare the y (vertical position) scale.
  const y = scaleEplusM()
    .domain([1, 10 ** (maxExponent + 1)])
    .range([height - marginBottom, marginTop]);

  // Custom tick values for the y-axis
  const logTicks = y.goodTicks(10);
  const strongTicks = y.goodTicks(1);
  const lightTicks = y.goodTicks([5]);
  const horizontalLines = lightTicks;

  // Create the SVG container.
  const svg = d3
     .select('#barchartsvg')
    .attr('width', width)
    .attr('height', height)
    .attr('viewBox', [0, 0, width, height])
    .attr('style', 'max-width: 100%; height: auto;');

  // Add background rectangles for each exponent group
  for (let exp = 0; exp <= maxExponent; exp++) {
    svg
      .append('rect')
      .attr('x', marginLeft)
      .attr('y', y(10 ** (exp + 1))) // top of the exponent range
      .attr('width', width - marginLeft - marginRight)
      .attr('height', y(10 ** exp) - y(10 ** (exp + 1))) // height of the exponent range
      .attr('fill', exp % 2 === 0 ? evenBackgroundColor : oddBackgroundColor);
  }

  // Add horizontal grid lines - thick
  svg
    .append('g')
    .attr('class', 'grid-strong')
    .attr('transform', `translate(${marginLeft},0)`)
    .call(
      d3
        .axisLeft(y)
        .tickValues(strongTicks)
        .tickSize(-width + marginLeft + marginRight)
        .tickFormat(''),
    )
    .call((g) => g.select('.domain').remove()); // This line removes the vertical domain line of the grid

  // Add horizontal grid lines - thin
  svg
    .append('g')
    .attr('class', 'grid')
    .attr('transform', `translate(${marginLeft},0)`)
    .call(
      d3
        .axisLeft(y)
        .tickValues(horizontalLines)
        .tickSize(-width + marginLeft + marginRight)
        .tickFormat(''),
    )
    .call((g) => g.select('.domain').remove()); // This line removes the vertical domain line of the grid

  // Strong ticks left.
  svg
    .append('g')
    .attr('transform', `translate(${marginLeft},0)`)
    .call(
      d3
        .axisLeft(y)
        .tickValues(strongTicks)
        .tickFormat(d3.format('~s'))
        .tickSize(4),
    )
    .selectAll('.tick text')
    .classed('strongText', true)
    .call((g) => g.select('.domain').remove());

  // Light ticks left.
  svg
    .append('g')
    .attr('transform', `translate(${marginLeft},0)`)
    .call(
      d3
        .axisLeft(y)
        .tickValues(lightTicks)
        .tickFormat(d3.format('~s'))
        .tickSize(4),
    )
    .selectAll('.tick text')
    .classed('lightText', true)
    .call((g) => g.select('.domain').remove());

  // Strong ticks right.
  svg
    .append('g')
    .attr('transform', `translate(${width - marginRight},0)`)
    .call(
      d3
        .axisRight(y)
        .tickValues(strongTicks)
        .tickFormat(d3.format('~s'))
        .tickSize(4),
    )
    .selectAll('.tick text')
    .classed('strongText', true)
    .call((g) => g.select('.domain').remove());

  // Light ticks right.
  svg
    .append('g')
    .attr('transform', `translate(${width - marginRight},0)`)
    .call(
      d3
        .axisRight(y)
        .tickValues(lightTicks)
        .tickFormat(d3.format('~s'))
        .tickSize(4),
    )
    .selectAll('.tick text')
    .classed('lightText', true)
    .call((g) => g.select('.domain').remove());

  // Add a rect for each bar.
  svg
    .append('g')
      .attr('fill', barColor)
    .selectAll()
    .data(data)
    .join('rect')
      .attr('x', (d) => x(d.Letter))
      .attr('y', (d) => y(d.Amount))
      .attr('height', (d) => y(1) - y(d.Amount))
      .attr('width', x.bandwidth())
      .append('title')
        .text((d) => d3.format('~s')(d.Amount));

  svg
    .append('text')
    .attr('x', marginLeft)
    .attr('y', marginTop - 15)
    .attr('text-anchor', 'end')
    .text('Value')
    .style('font-size', '14px');

  // Ticks without text and left axis.
  svg
    .append('g')
    .attr('transform', `translate(${marginLeft},0)`)
    .call(d3.axisLeft(y).tickValues(logTicks).tickFormat('').tickSize(4));

  // Ticks without text and right axis.
  svg
    .append('g')
    .attr('transform', `translate(${width - marginRight},0)`)
    .call(d3.axisRight(y).tickValues(logTicks).tickFormat('').tickSize(4));

  // Append the SVG element.
  window['container'].append(svg.node());
</script>
</head>
  <body>
  <div id="container">
    <svg id="barchartsvg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <style>
  svg {
    font-family: 'Rubik', serif;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .grid {
    color: black;
    opacity: 0.5;
    stroke-width: 0.5px;
  }

  .grid-strong {
    color: rgb(20, 22, 76);
    stroke-width: 1px;
  }

  .strongText {
    font-size: 16px;
    font-weight: bold;
    color: rgb(20, 22, 76);
  }

  .strongSSBText {
    font-size: 16px;
    font-weight: bold;
  }

  .lightText {
    font-size: 16px;
    color: grey;
  }

  .dashed-line {
    stroke: grey;
    stroke-width: 2;
    stroke-dasharray: 4;
  }
</style>
    </svg>

    <script>
function saveSvg(id, name) {
const svgEl = document.getElementById(id);
  svgEl.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  var svgData = svgEl.outerHTML;
  var preface = '<?xml version="1.0" standalone="no"?>\r\n';
  var svgBlob = new Blob([preface, svgData], {type:"image/svg+xml;charset=utf-8"});
  var svgUrl = URL.createObjectURL(svgBlob);
  var downloadLink = document.createElement("a");
  downloadLink.href = svgUrl;
  downloadLink.download = name;
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
}

window.addEventListener(
      'keypress',
      function (evt) {
        if (evt.code == "KeyS")
          saveSvg('barchartsvg', 'bar-chart.svg')
});
    </script>
</div>
</body>
</html>
