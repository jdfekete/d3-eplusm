<!DOCTYPE html>
<meta charset="utf-8">
<title>Tick for an EplusM scale</title>
<div id="container"></div>
<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import { scaleEplusM } from 'd3-eplusm';

// Declare the chart dimensions and margins.
const width = 1024;
const height = 100;
const marginTop = 20;
const marginRight = 20;
const marginBottom = 30;
const marginLeft = 40;
// const logTicks = [
//   1e0, 5e0, 1e1, 5e1, 1e2, 5e2, 1e3, 5e3,
//   1e4, 5e4, 1e5, 5e5, 1e6, 5e6, 1e7, 5e7,
//   1e8, 5e8, 1e9, 5e9, 1e10
//   ];

// Declare the x (horizontal position) scale.
const x1 = scaleEplusM()
      .domain([1, 1e10])
      .range([marginLeft, width - marginRight]);

const logTicks = x1.defaultTicks();

const x2 = d3.scaleLog()
      .domain([1, 1e10])
      .range([marginLeft, width - marginRight]);


// Create the SVG container.
const svg = d3.create("svg")
    .attr("width", width)
    .attr("height", height);

// Add the x-axis.
svg.append("g")
  .attr("transform", `translate(0,${height - marginBottom})`)
  .call(d3.axisBottom(x1)
        //.ticks(tickCount, "~s")
        .tickValues(logTicks)
       )
  .selectAll("text")
        .style("text-anchor", "end")
        .attr("dx", "-.8em")
        .attr("dy", ".15em")
        .attr("transform", function (d) {
          return "rotate(-40)";
        });

svg.append("g")
  .attr("transform", `translate(0,${height - 3*marginBottom})`)
  .call(d3.axisBottom(x2)
        .tickValues(logTicks)
        // .ticks(tickCount, "~s")
       )
  .selectAll("text")
  .style("text-anchor", "end")
  .attr("dx", "-.8em")
  .attr("dy", ".15em")
  .attr("transform", function (d) {
    return "rotate(-40)";
  });

// Append the SVG element.
container.append(svg.node());

</script>
